<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Later.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
</style>
<style>
/* ─── TOKENS ─── */
:root {
  --bg:       #f7f5ef;
  --surface:  #ffffff;
  --ink:      #0d0d0d;
  --mute:     #888888;
  --border:   #e0ddd5;
  --accent:   #ff3d00;
  --ok:       #00c853;
  --font-hd:  'Space Grotesk', 'Arial Black', 'Franklin Gothic Medium', Arial, sans-serif;
  --font-bd:  'Inter', 'Segoe UI', Arial, sans-serif;
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
input, textarea, button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ─── BASE ─── */
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-bd);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  min-height: 100dvh;
}

/* ─── CLIPBOARD AUTO-DETECT POPUP BANNER ─── */
.clip-prompt {
  background: var(--ink);
  color: #fff;
  border-bottom: 3px solid var(--accent);
  padding: 12px 20px;
  position: sticky;
  top: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  animation: slideDown .25s ease-out;
}
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
.clip-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.clip-tag { font: 700 10px var(--font-hd); color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
.clip-url { font-size: 13px; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip-btns { display: flex; gap: 8px; align-items: center; }
.clip-btn-save {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 14px;
  font: 700 11px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  white-space: nowrap;
}
.clip-btn-dismiss {
  background: transparent;
  color: #888;
  border: none;
  font-size: 16px;
  padding: 4px 8px;
  cursor: pointer;
}
.clip-btn-dismiss:hover { color: #fff; }

/* ─── LAYOUT ─── */
.shell { max-width: 520px; margin: 0 auto; padding: 0 20px 80px; }

/* ─── HEADER ─── */
.header { padding: 36px 0 24px; border-bottom: 2px solid var(--ink); margin-bottom: 24px; }
.accent-rule { width: 40px; height: 4px; background: var(--accent); margin-bottom: 16px; }
.wordmark {
  font-family: var(--font-hd);
  font-size: clamp(56px, 16vw, 84px);
  font-weight: 700;
  letter-spacing: -5px;
  line-height: 0.95;
  text-transform: uppercase;
}
.wordmark .dot { color: var(--accent); }
.tagline {
  font-family: var(--font-bd);
  font-size: 13px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 12px;
  font-weight: 500;
}

/* ─── ADD SECTION ─── */
.add-section { margin-bottom: 16px; }
.input-row { display: flex; gap: 0; }
.url-input {
  flex: 1;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-right: none;
  padding: 14px 16px;
  font: 15px var(--font-bd);
  color: var(--ink);
  outline: none;
  border-radius: 0;
  transition: border-color .15s;
}
.url-input:focus { border-color: var(--accent); }
.url-input::placeholder { color: #bbb; font-size: 14px; }
.btn-save {
  background: var(--ink);
  color: var(--bg);
  border: 2px solid var(--ink);
  padding: 14px 22px;
  font: 700 14px var(--font-hd);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  white-space: nowrap;
  transition: background .15s, color .15s;
  border-radius: 0;
}
.btn-save:hover, .btn-save:active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ─── SEARCH ─── */
.search-input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  padding: 12px 16px;
  font: 14px var(--font-bd);
  color: var(--ink);
  outline: none;
  border-radius: 0;
  margin-bottom: 18px;
  transition: border-color .15s;
}
.search-input:focus { border-color: var(--ink); }
.search-input::placeholder { color: #bbb; }

/* ─── TABS ─── */
.tabs-row { display: flex; border: 2px solid var(--ink); width: fit-content; margin-bottom: 20px; }
.tab {
  padding: 10px 18px;
  background: transparent;
  border: none;
  border-right: 2px solid var(--ink);
  color: var(--mute);
  font: 700 12px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.tab:last-of-type { border-right: none; }
.tab.on { background: var(--ink); color: var(--bg); }
.tab-export:hover { background: var(--border); color: var(--ink); }

/* ─── BANNER ─── */
.banner {
  background: var(--accent);
  color: #fff;
  padding: 12px 16px;
  margin-bottom: 16px;
  font: 700 13px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

/* ─── ITEM CARD ─── */
.item {
  background: var(--surface);
  border: 2px solid var(--ink);
  border-left: 6px solid var(--accent);
  padding: 16px;
  margin-bottom: 14px;
  transition: border-left-color .15s;
}
.item:hover { border-left-color: var(--ink); }
.item.done { border-left-color: var(--ok); opacity: .7; }

.item-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.src-badge {
  font: 700 11px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--mute);
  background: var(--bg);
  padding: 3px 10px;
  border: 1px solid var(--border);
}
.ai-badge {
  font: 700 10px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #ffffff;
  background: var(--ink);
  padding: 3px 8px;
  margin-left: 6px;
  display: inline-flex;
  align-items: center;
}
.item-date {
  font-size: 11px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.item-title {
  font: 700 16px var(--font-hd);
  line-height: 1.3;
  margin-bottom: 12px;
  word-break: break-word;
}
.item-title a:hover { color: var(--accent); }

/* ─── PROMINENT AI NOTE CALLOUT ─── */
.ai-callout {
  background: var(--bg);
  border: 2px solid var(--ink);
  padding: 14px;
  margin-bottom: 12px;
}
.ai-callout-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.ai-callout-label {
  font: 700 11px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent);
}
.ai-callout-edit {
  font: 600 11px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
  background: transparent;
  border: none;
  color: var(--mute);
  cursor: pointer;
  padding: 2px 6px;
}
.ai-callout-edit:hover { color: var(--ink); text-decoration: underline; }
.ai-callout-text {
  font-size: 14px;
  line-height: 1.55;
  color: #111;
  font-weight: 500;
}

.item-note {
  width: 100%;
  background: var(--bg);
  border: 2px solid var(--border);
  padding: 10px 12px;
  font: 14px var(--font-bd);
  color: #222;
  resize: vertical;
  min-height: 48px;
  margin-bottom: 10px;
  outline: none;
  border-radius: 0;
  transition: border-color .15s;
}
.item-note:focus { border-color: var(--ink); }
.item-note::placeholder { color: #aaa; font-style: italic; }

.item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.item-tag {
  flex: 1;
  min-width: 90px;
  background: var(--bg);
  border: 2px solid var(--border);
  padding: 8px 12px;
  font: 13px var(--font-bd);
  color: var(--ink);
  outline: none;
  border-radius: 0;
  transition: border-color .15s;
}
.item-tag:focus { border-color: var(--ink); }
.item-tag::placeholder { color: #bbb; }

.act-primary {
  padding: 8px 16px;
  background: var(--ink);
  color: var(--bg);
  border: 2px solid var(--ink);
  font: 700 12px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.act-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.act-ghost {
  padding: 8px 12px;
  background: transparent;
  border: 2px solid var(--border);
  color: var(--mute);
  font: 600 12px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.act-ghost:hover { border-color: var(--ink); color: var(--ink); }
.act-ai {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 700;
}
.act-ai:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.act-danger:hover { border-color: var(--accent); color: var(--accent); }

/* ─── VAULT STYLES ─── */
.vault-panel {
  background: var(--surface);
  border: 2px solid var(--ink);
  padding: 24px 20px;
  margin-top: 10px;
}
.vault-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 14px;
  margin-bottom: 20px;
}
.vault-title {
  font: 700 20px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.vault-pin-box {
  max-width: 320px;
  margin: 20px auto;
  text-align: center;
}
.vault-pin-input {
  width: 100%;
  font-size: 28px;
  letter-spacing: 12px;
  text-align: center;
  border: 2px solid var(--ink);
  padding: 10px;
  margin: 14px 0;
  outline: none;
  background: var(--bg);
}
.vault-card {
  border: 2px solid var(--ink);
  background: var(--bg);
  padding: 16px;
  margin-bottom: 12px;
}
.vault-card-title {
  font: 700 16px var(--font-hd);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}
.vault-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 12px;
  margin-bottom: 6px;
  font-size: 13px;
}
.vault-btn-copy {
  background: transparent;
  border: 1px solid var(--border);
  padding: 4px 8px;
  font: 700 10px var(--font-hd);
  text-transform: uppercase;
  cursor: pointer;
}
.vault-btn-copy:hover { border-color: var(--ink); }
.vault-form {
  background: var(--bg);
  border: 2px dashed var(--ink);
  padding: 16px;
  margin-bottom: 20px;
}
.vault-form input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 14px;
  outline: none;
}
.vault-form input:focus { border-color: var(--ink); }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 56px 16px;
  border: 2px dashed var(--border);
  margin-top: 8px;
}
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty p {
  font: 700 13px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--mute);
  line-height: 1.7;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 22px;
  font: 700 13px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.offline-bar {
  background: var(--ink);
  color: var(--bg);
  text-align: center;
  padding: 8px;
  font: 700 11px var(--font-hd);
  text-transform: uppercase;
  letter-spacing: 2px;
  display: none;
}
body.offline .offline-bar { display: block; }
</style>
</head>
<body>

<div class="offline-bar">— Offline — All your saves are available locally —</div>

<!-- CLIPBOARD AUTO-DETECT PROMPT -->
<div id="clipPrompt" class="clip-prompt" style="display:none;">
  <div class="clip-info">
    <span class="clip-tag">📋 Copied Link Detected</span>
    <span id="clipUrlText" class="clip-url"></span>
  </div>
  <div class="clip-btns">
    <button id="clipSaveBtn" class="clip-btn-save">Save & Summarize →</button>
    <button id="clipDismissBtn" class="clip-btn-dismiss" title="Dismiss">✕</button>
  </div>
</div>

<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="accent-rule"></div>
    <div class="wordmark">Later<span class="dot">.</span></div>
    <p class="tagline">Save now. Check it when you're ready.</p>
  </header>

  <!-- ADD SECTION (Hidden when in Vault) -->
  <section id="addSection" class="add-section">
    <div class="input-row">
      <input id="urlInput" class="url-input" type="url" inputmode="url"
             placeholder="Paste any social media or web link…"
             aria-label="Paste a link to save">
      <button id="addBtn" class="btn-save">Save →</button>
    </div>
  </section>

  <!-- SEARCH -->
  <input id="searchInput" class="search-input" type="search"
         placeholder="Search your saved items…" aria-label="Search saved items">

  <!-- TABS: TO CHECK | DONE | VAULT | EXPORT -->
  <div class="tabs-row">
    <button id="tabTodo" class="tab on">To check</button>
    <button id="tabDone" class="tab">Done</button>
    <button id="tabVault" class="tab">Vault 🔒</button>
    <button id="exportBtn" class="tab tab-export">Export</button>
  </div>

  <!-- BANNER -->
  <div id="banner"></div>

  <!-- BOOKMARK LIST VIEW -->
  <div id="listView">
    <div id="list"></div>
  </div>

  <!-- PASSWORD VAULT VIEW -->
  <div id="vaultView" style="display:none;"></div>

</div><!-- /shell -->

<div class="toast" id="toast"></div>

<script>
/* ─── STATE ─── */
const KEY = 'later-items-v1';
const VAULT_KEY = 'later-vault-v1';
const PIN_HASH_KEY = 'later-vault-pin-hash';

let items = [];
let view = 'todo'; // 'todo' | 'done' | 'vault'
let q = '';
let activeClipUrl = '';

// Vault state (in-memory only when unlocked)
let vaultUnlocked = false;
let vaultPIN = '';
let vaultData = [];

/* ─── UTILS ─── */
const $ = id => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ─── PLATFORM IDENTIFIER (ALL SOCIAL MEDIA) ─── */
function source(u) {
  try {
    const h = new URL(u).hostname.replace(/^(www\.|m\.)/, '').toLowerCase();
    if (/youtube\.com|youtu\.be/.test(h)) return 'YouTube';
    if (/instagram\.com/.test(h)) return 'Instagram';
    if (/tiktok\.com/.test(h)) return 'TikTok';
    if (/facebook\.com|fb\.watch|fb\.com/.test(h)) return 'Facebook';
    if (/x\.com|twitter\.com/.test(h)) return 'X / Twitter';
    if (/threads\.net/.test(h)) return 'Threads';
    if (/reddit\.com/.test(h)) return 'Reddit';
    if (/linkedin\.com/.test(h)) return 'LinkedIn';
    if (/pinterest\.com/.test(h)) return 'Pinterest';
    if (/github\.com/.test(h)) return 'GitHub';
    if (/medium\.com|substack\.com/.test(h)) return 'Article';
    return h.split('.')[0].toUpperCase();
  } catch { return 'Link'; }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ─── CLIPBOARD AUTO-DETECTION ─── */
let lastCheckedClip = '';
async function checkClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  try {
    const text = await navigator.clipboard.readText();
    if (!text || text === lastCheckedClip) return;
    const match = text.trim().match(/https?:\/\/\S+/);
    if (match) {
      const url = match[0];
      const exists = items.some(i => i.url === url);
      if (!exists && url !== activeClipUrl) {
        lastCheckedClip = text;
        activeClipUrl = url;
        $('clipUrlText').textContent = url;
        $('clipPrompt').style.display = 'flex';
      }
    }
  } catch (e) {
    // Clipboard permission not granted or browser window inactive
  }
}

$('clipSaveBtn').addEventListener('click', () => {
  if (activeClipUrl) {
    add({ url: activeClipUrl });
    toast('Saved to Later ✓');
    $('clipPrompt').style.display = 'none';
    activeClipUrl = '';
    view = 'todo';
    render();
  }
});

$('clipDismissBtn').addEventListener('click', () => {
  $('clipPrompt').style.display = 'none';
  activeClipUrl = '';
});

window.addEventListener('focus', checkClipboard);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkClipboard();
});

/* ─── ADD & GEMINI AI ─── */
function add({ url, title = '', note = '' }) {
  if (!url) return null;
  const dup = items.find(i => i.url === url);
  if (dup) { toast('Already saved!'); return dup.id; }
  const it = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    url, title: title.trim(), note, tag: '', done: false, ts: Date.now(), ai: false
  };
  items.unshift(it);
  store();
  
  if (!note) {
    fetchAISummary(it.id);
  }
  return it.id;
}

async function fetchAISummary(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;

  const card = document.querySelector(`[data-id="${id}"]`);
  const textarea = card?.querySelector('.item-note');
  if (textarea && !it.note) {
    textarea.placeholder = "✨ Generating 1-sentence AI summary...";
  }

  try {
    const res = await fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: it.url, title: it.title })
    });

    if (!res.ok) {
      if (textarea && !it.note) textarea.placeholder = "Why did you save this?";
      return;
    }

    const data = await res.json();
    if (data.summary) {
      it.note = data.summary;
      if (data.tag && !it.tag) it.tag = data.tag;
      if (data.title && (!it.title || it.title === it.url)) it.title = data.title;
      it.ai = true;
      store();
      render();
      toast('✨ AI Note Generated!');
    }
  } catch (err) {
    if (textarea && !it.note) textarea.placeholder = "Why did you save this?";
  }
}

/* ─── SHARE TARGET HANDLER ─── */
function captureShare() {
  const p = new URLSearchParams(location.search);
  const hasShare = [...p.keys()].some(k => ['url', 'text', 'title'].includes(k));
  if (!hasShare) return;
  const text = p.get('text') || '';
  const rawUrl = p.get('url') || text;
  const match = rawUrl.match(/https?:\/\/\S+/);
  const url = match ? match[0] : '';
  const title = (p.get('title') || text.replace(url, '')).trim();
  history.replaceState(null, '', location.pathname);
  if (url) {
    add({ url, title });
    toast('Saved to Later ✓');
  } else {
    toast('No link found in share');
  }
}

/* ─── SIMPLE ENCRYPTION FOR PASSWORD VAULT (PBKDF2 + AES-GCM) ─── */
async function deriveKey(pin, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptVault(data, pin) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pin, salt);
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    enc.encode(JSON.stringify(data))
  );
  return {
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(ciphertext))
  };
}

async function decryptVault(encrypted, pin) {
  const dec = new TextDecoder();
  const salt = new Uint8Array(encrypted.salt);
  const iv = new Uint8Array(encrypted.iv);
  const key = await deriveKey(pin, salt);
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv },
    key,
    new Uint8Array(encrypted.data)
  );
  return JSON.parse(dec.decode(decrypted));
}

async function hashPin(pin) {
  const enc = new TextEncoder();
  const hash = await crypto.subtle.digest('SHA-256', enc.encode(pin + '_later_salt_2026'));
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ─── RENDER ─── */
function render() {
  $('tabTodo').classList.toggle('on', view === 'todo');
  $('tabDone').classList.toggle('on', view === 'done');
  $('tabVault').classList.toggle('on', view === 'vault');

  if (view === 'vault') {
    $('addSection').style.display = 'none';
    $('searchInput').style.display = 'none';
    $('banner').style.display = 'none';
    $('listView').style.display = 'none';
    $('vaultView').style.display = 'block';
    renderVault();
    return;
  }

  // Bookmarks view
  $('addSection').style.display = 'block';
  $('searchInput').style.display = 'block';
  $('banner').style.display = 'block';
  $('listView').style.display = 'block';
  $('vaultView').style.display = 'none';

  const pending = items.filter(i => !i.done);
  $('banner').innerHTML = pending.length
    ? `<div class="banner">— ${pending.length} item${pending.length > 1 ? 's' : ''} waiting to be checked</div>`
    : '';

  const shown = items.filter(i =>
    i.done === (view === 'done') &&
    `${i.title} ${i.note} ${i.tag} ${i.url}`.toLowerCase().includes(q)
  );

  if (!shown.length) {
    $('list').innerHTML = `
      <div class="empty">
        <div class="empty-icon">${view === 'todo' ? '📋' : '✅'}</div>
        <p>${view === 'todo'
          ? 'Nothing saved yet.\nTap Share on any post\nand pick Later.'
          : 'Nothing marked done yet.'}</p>
      </div>`;
    return;
  }

  $('list').innerHTML = shown.map(i => `
    <div class="item ${i.done ? 'done' : ''}" data-id="${i.id}">
      <div class="item-meta">
        <div>
          <span class="src-badge">${esc(source(i.url))}</span>
          ${i.ai ? '<span class="ai-badge">✨ AI Note</span>' : ''}
        </div>
        <span class="item-date">${new Date(i.ts).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})}</span>
      </div>
      <div class="item-title">
        <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
          ${esc(i.title || i.url)}
        </a>
      </div>

      <!-- PROMINENT NOTE CALLOUT -->
      ${i.note ? `
        <div class="ai-callout">
          <div class="ai-callout-header">
            <span class="ai-callout-label">💡 KEY TAKEAWAY</span>
            <button class="ai-callout-edit" data-a="editnote" data-id="${i.id}">Edit</button>
          </div>
          <p class="ai-callout-text">${esc(i.note)}</p>
        </div>
        <textarea class="item-note edit-mode" style="display:none;" data-f="note" data-id="${i.id}">${esc(i.note)}</textarea>
      ` : `
        <textarea class="item-note" placeholder="Why did you save this? (Tap ✨ AI Note to generate)" data-f="note" data-id="${i.id}"></textarea>
      `}

      <div class="item-actions">
        <input class="item-tag" placeholder="Add tag (e.g. exam prep)" value="${esc(i.tag)}" data-f="tag" data-id="${i.id}">
        <button class="act-ghost act-ai" data-a="ai" data-id="${i.id}" title="Generate 1-sentence AI summary">✨ AI Note</button>
        <button class="act-primary" data-a="done" data-id="${i.id}">${i.done ? 'Move back' : 'Mark done'}</button>
        <button class="act-ghost" data-a="copy" data-id="${i.id}">Copy</button>
        <button class="act-ghost act-danger" data-a="del" data-id="${i.id}">Delete</button>
      </div>
    </div>
  `).join('');
}

/* ─── RENDER VAULT ─── */
function renderVault() {
  const savedHash = localStorage.getItem(PIN_HASH_KEY);

  // Screen 1: Set up new PIN
  if (!savedHash) {
    $('vaultView').innerHTML = `
      <div class="vault-panel">
        <div class="vault-title" style="text-align:center;margin-bottom:12px;">🔐 Setup Password Vault</div>
        <p style="font-size:13px;color:var(--mute);text-align:center;">Create a 4-digit Master PIN to securely encrypt passwords locally on this device.</p>
        <div class="vault-pin-box">
          <input id="newPinInput" type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" class="vault-pin-input" placeholder="••••">
          <button id="savePinBtn" class="act-primary" style="width:100%;padding:12px;">Create Master PIN →</button>
        </div>
      </div>
    `;
    $('savePinBtn').onclick = async () => {
      const pin = $('newPinInput').value.trim();
      if (pin.length !== 4) return toast('PIN must be 4 digits');
      const hash = await hashPin(pin);
      localStorage.setItem(PIN_HASH_KEY, hash);
      vaultPIN = pin;
      vaultUnlocked = true;
      vaultData = [];
      toast('Vault initialized!');
      renderVault();
    };
    return;
  }

  // Screen 2: Locked -> Enter PIN
  if (!vaultUnlocked) {
    $('vaultView').innerHTML = `
      <div class="vault-panel">
        <div class="vault-title" style="text-align:center;margin-bottom:12px;">🔒 Vault Locked</div>
        <p style="font-size:13px;color:var(--mute);text-align:center;">Enter your 4-digit PIN to access your passwords.</p>
        <div class="vault-pin-box">
          <input id="unlockPinInput" type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" class="vault-pin-input" placeholder="••••" autofocus>
          <button id="unlockPinBtn" class="act-primary" style="width:100%;padding:12px;">Unlock Vault 🔓</button>
        </div>
      </div>
    `;
    $('unlockPinBtn').onclick = async () => {
      const pin = $('unlockPinInput').value.trim();
      const hash = await hashPin(pin);
      if (hash !== savedHash) {
        toast('Incorrect PIN');
        $('unlockPinInput').value = '';
        return;
      }
      vaultPIN = pin;
      try {
        const stored = localStorage.getItem(VAULT_KEY);
        vaultData = stored ? await decryptVault(JSON.parse(stored), pin) : [];
      } catch (e) {
        vaultData = [];
      }
      vaultUnlocked = true;
      toast('Vault unlocked!');
      renderVault();
    };
    return;
  }

  // Screen 3: Unlocked -> Passwords List
  $('vaultView').innerHTML = `
    <div class="vault-panel">
      <div class="vault-header">
        <span class="vault-title">🔐 Password Vault</span>
        <button id="lockVaultBtn" class="act-ghost" style="padding:6px 12px;font-size:11px;">🔒 Lock</button>
      </div>

      <!-- Add New Credential Form -->
      <div class="vault-form">
        <div style="font:700 12px var(--font-hd);text-transform:uppercase;margin-bottom:10px;">+ Save New Website Password</div>
        <input id="vSite" placeholder="Website / Service (e.g. Netflix, Stanford, Gmail)">
        <input id="vUser" placeholder="Username or Email">
        <div style="display:flex;gap:6px;">
          <input id="vPass" type="password" placeholder="Password" style="flex:1;">
          <button id="vGenBtn" class="act-ghost" title="Generate strong password" style="margin-bottom:8px;padding:0 12px;">🎲 Gen</button>
        </div>
        <button id="vSaveBtn" class="act-primary" style="width:100%;padding:10px;">Save Credential to Vault</button>
      </div>

      <!-- Saved Passwords List -->
      <div id="vaultList">
        ${vaultData.length ? vaultData.map((item, idx) => `
          <div class="vault-card">
            <div class="vault-card-title">
              <span>${esc(item.site)}</span>
              <button class="act-ghost act-danger" data-va="del" data-vidx="${idx}" style="padding:2px 8px;font-size:10px;">Delete</button>
            </div>
            <div class="vault-field">
              <span>👤 ${esc(item.user)}</span>
              <button class="vault-btn-copy" data-va="copyuser" data-vidx="${idx}">Copy User</button>
            </div>
            <div class="vault-field">
              <span id="passSpan_${idx}">••••••••</span>
              <div style="display:flex;gap:4px;">
                <button class="vault-btn-copy" data-va="peek" data-vidx="${idx}">Eye 👁</button>
                <button class="vault-btn-copy" data-va="copypass" data-vidx="${idx}">Copy Pass</button>
              </div>
            </div>
          </div>
        `).join('') : '<div class="empty"><p>No saved passwords yet.<br>Add your first credential above.</p></div>'}
      </div>
    </div>
  `;

  $('lockVaultBtn').onclick = () => {
    vaultUnlocked = false;
    vaultPIN = '';
    vaultData = [];
    toast('Vault locked 🔒');
    renderVault();
  };

  $('vGenBtn').onclick = () => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%^&*';
    let p = '';
    for (let i = 0; i < 14; i++) p += chars[Math.floor(Math.random() * chars.length)];
    $('vPass').value = p;
    $('vPass').type = 'text';
    toast('Strong password generated!');
  };

  $('vSaveBtn').onclick = async () => {
    const site = $('vSite').value.trim();
    const user = $('vUser').value.trim();
    const pass = $('vPass').value.trim();
    if (!site || !pass) return toast('Site and Password are required');
    vaultData.unshift({ id: Date.now().toString(36), site, user, pass });
    const encrypted = await encryptVault(vaultData, vaultPIN);
    localStorage.setItem(VAULT_KEY, JSON.stringify(encrypted));
    toast('Password encrypted and saved ✓');
    renderVault();
  };

  // Delegated vault list actions
  $('vaultList').onclick = async (e) => {
    const va = e.target.dataset.va;
    const idx = e.target.dataset.vidx;
    if (!va || idx === undefined) return;
    const it = vaultData[idx];

    if (va === 'copyuser') {
      await navigator.clipboard.writeText(it.user);
      toast('Username copied!');
    }
    if (va === 'copypass') {
      await navigator.clipboard.writeText(it.pass);
      toast('Password copied!');
    }
    if (va === 'peek') {
      const span = $(`passSpan_${idx}`);
      if (span.textContent === '••••••••') {
        span.textContent = it.pass;
        e.target.textContent = 'Hide';
      } else {
        span.textContent = '••••••••';
        e.target.textContent = 'Eye 👁';
      }
    }
    if (va === 'del' && confirm(`Delete credentials for ${it.site}?`)) {
      vaultData.splice(idx, 1);
      const encrypted = await encryptVault(vaultData, vaultPIN);
      localStorage.setItem(VAULT_KEY, JSON.stringify(encrypted));
      renderVault();
      toast('Deleted');
    }
  };
}

/* ─── EVENTS ─── */
$('addBtn').addEventListener('click', () => {
  const u = $('urlInput').value.trim();
  if (!u) return toast('Paste a link first');
  if (!/^https?:\/\//.test(u)) return toast('Must start with https://');
  add({ url: u });
  $('urlInput').value = '';
  view = 'todo';
  render();
});

$('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('addBtn').click();
});

$('searchInput').addEventListener('input', e => {
  q = e.target.value.toLowerCase();
  render();
});

$('tabTodo').addEventListener('click', () => { view = 'todo'; render(); });
$('tabDone').addEventListener('click', () => { view = 'done'; render(); });
$('tabVault').addEventListener('click', () => { view = 'vault'; render(); });

$('exportBtn').addEventListener('click', async () => {
  const txt = items.map(i =>
    `${i.title || '(no title)'}\n${i.url}${i.note ? '\nNote: ' + i.note : ''}${i.tag ? '\nTag: ' + i.tag : ''}`
  ).join('\n\n');
  try {
    await navigator.clipboard.writeText(txt);
    toast('All items copied to clipboard');
  } catch {
    toast('Copy failed — try again');
  }
});

// Delegated: actions (done / delete / copy / ai / editnote)
$('list').addEventListener('click', async e => {
  const a = e.target.dataset.a;
  if (!a) return;
  const id = e.target.dataset.id;
  const it = items.find(i => i.id === id);
  if (!it) return;

  if (a === 'ai') {
    toast('✨ Consulting Gemini AI...');
    fetchAISummary(id);
  }
  if (a === 'editnote') {
    const card = e.target.closest('.item');
    const callout = card.querySelector('.ai-callout');
    const textarea = card.querySelector('.item-note.edit-mode');
    if (callout && textarea) {
      callout.style.display = 'none';
      textarea.style.display = 'block';
      textarea.focus();
    }
  }
  if (a === 'done') { it.done = !it.done; store(); render(); }
  if (a === 'del' && confirm('Delete this saved item?')) {
    items = items.filter(i => i !== it); store(); render();
  }
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(it.url); toast('Link copied!'); }
    catch { toast('Copy failed'); }
  }
});

// Delegated: field edits (note / tag)
$('list').addEventListener('change', e => {
  const f = e.target.dataset.f;
  if (!f) return;
  const id = e.target.dataset.id;
  const it = items.find(i => i.id === id);
  if (it) { it[f] = e.target.value; store(); }
});

// Offline indicator
window.addEventListener('online',  () => document.body.classList.remove('offline'));
window.addEventListener('offline', () => document.body.classList.add('offline'));
if (!navigator.onLine) document.body.classList.add('offline');

/* ─── BOOT ─── */
items = load();
captureShare();
render();
checkClipboard();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
